# Engine tests on every push and pull request: the 9×9 analysis must stay
# identical (golden fingerprints), and every grid size must solve correctly.
name: Tests
on:
  push:
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/run.js
