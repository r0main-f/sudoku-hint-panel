# Check that the Chrome Web Store secrets work, without uploading anything:
# trade the refresh token for an access token, then read the item's status.
# Run it from the Actions tab ("Run workflow").
name: Check store access

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the item's status from the Chrome Web Store
        env:
          EXTENSION_ID: bhhgadcdhbondeacamocgieacckjbcon
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          missing=0
          for v in PUBLISHER_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::secret CWS_$v is missing or empty"; missing=1; else echo "secret CWS_$v: present (${#v} chars name, value hidden)"; fi
          done
          [ "$missing" = 0 ] || exit 1
          # the shape of the publisher ID (never its value)
          trimmed=$(printf '%s' "$PUBLISHER_ID" | tr -d '[:space:]')
          [ "$trimmed" = "$PUBLISHER_ID" ] || echo "::warning::CWS_PUBLISHER_ID contains spaces or line breaks (trimmed for this check)"
          PUBLISHER_ID=$trimmed
          if printf '%s' "$PUBLISHER_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then shape="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx (the dashboard's format)"
          elif printf '%s' "$PUBLISHER_ID" | grep -q '@'; then shape="an email address — not the publisher ID"
          elif printf '%s' "$PUBLISHER_ID" | grep -Eq '^[a-p]{32}$'; then shape="an extension ID — not the publisher ID"
          else shape="something else"; fi
          echo "CWS_PUBLISHER_ID: ${#PUBLISHER_ID} characters, looks like $shape"
          token_json=$(curl -s https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token)
          ACCESS=$(echo "$token_json" | jq -r '.access_token // empty')
          if [ -z "$ACCESS" ]; then
            echo "::error::Google refused the client ID / secret / refresh token: $(echo "$token_json" | jq -c '{error, error_description}')"
            exit 1
          fi
          echo "::add-mask::$ACCESS"
          echo "OK: Google accepted the client ID, client secret and refresh token (scope: $(echo "$token_json" | jq -r .scope))."
          code=$(curl -s -o status.json -w '%{http_code}' -H "Authorization: Bearer $ACCESS" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus")
          echo "Store API (v2, with publisher ID) answered HTTP $code"
          # second opinion without the publisher ID: does this Google account own the item?
          code1=$(curl -s -o v1.json -w '%{http_code}' -H "Authorization: Bearer $ACCESS" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID?projection=DRAFT")
          echo "Store API (v1, without publisher ID) answered HTTP $code1"
          if [ "$code1" = "200" ]; then echo "OK: the Google account behind the refresh token owns Sudoku Hint Panel (draft version $(jq -r '.crxVersion // "?"' v1.json), state $(jq -r '.uploadState // "?"' v1.json))."
          else echo "v1 says: $(jq -c '.error | {code, status, message}' v1.json 2>/dev/null || head -c 300 v1.json)"; fi
          if [ "$code" != "200" ] && [ "$code1" = "200" ]; then
            echo "::warning::Releases will still reach the store through the older v1.1 API (v2 said: $(jq -c '.error.message' status.json 2>/dev/null))."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::The store refused the request: $(jq -c '.error | {code, status, message}' status.json 2>/dev/null || head -c 300 status.json)"
            exit 1
          fi
          echo "OK: the store recognises the publisher ID and gives access to Sudoku Hint Panel."
          jq '{published: .publishedItemRevisionStatus, submitted: .submittedItemRevisionStatus, lastAsyncUploadState}' status.json || cat status.json
