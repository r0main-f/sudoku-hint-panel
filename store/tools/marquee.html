<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1400px;height:560px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
body{background:linear-gradient(120deg,#26489a 0%,#325aaf 45%,#4573cf 100%);color:#fff;position:relative}
.glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 65%)}
.icon{position:absolute;left:84px;top:96px;width:104px;height:104px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}
h1{position:absolute;left:84px;top:222px;margin:0;font-size:58px;line-height:1.05;letter-spacing:-.8px}
p{position:absolute;left:86px;top:360px;margin:0;width:500px;font-size:24px;line-height:1.4;color:#e1e9fb}
.chips{position:absolute;left:84px;bottom:56px;display:flex;gap:10px}
.chips span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-size:15px;color:#f0f4fe}
.shot{position:absolute;right:56px;top:46px;height:468px;border-radius:14px;box-shadow:0 18px 50px rgba(10,25,70,.35)}
</style></head><body>
<div class="glow"></div>
<img class="icon" src="icon-512.png">
<h1>Sudoku<br>Hint Panel</h1>
<p>Learn the techniques at your own level — one hint at a time, with its reasoning.</p>
<div class="chips"><span>Step by step assist</span><span>Any grid, up to 16×16</span><span>Free &amp; open source</span></div>
<img class="shot" src="marquee-shot.png">
</body></html>
