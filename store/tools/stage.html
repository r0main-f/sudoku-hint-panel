<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#eef2f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:#1e2a44}
#cap{position:absolute;left:178px;top:40px;width:580px}
#cap h1{margin:0;font-size:32px;line-height:1.15;letter-spacing:-.3px}
#cap p{margin:10px 0 0;font-size:18px;color:#4a5672;line-height:1.4}
#game{position:absolute;left:178px;top:190px;background:#fff;box-shadow:0 10px 40px rgba(30,50,100,.12);border-radius:6px}
canvas{width:560px;height:560px;display:block}
.game-controls-pencil,.game-controls-undo{display:none}
</style></head><body>
<div id="cap"><h1></h1><p></p></div>
<div id="game"><canvas width="900" height="900"></canvas></div>
<div class="game-controls-pencil"></div><div class="game-controls-undo"></div>
<script>
function draw(){const g=JSON.parse(localStorage.main_game);const c=document.querySelector('canvas').getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,900,900);
for(let i=0;i<=9;i++){c.strokeStyle=i%3?'#c9d1e3':'#344055';c.lineWidth=i%3?2:5;c.beginPath();c.moveTo(i*100,0);c.lineTo(i*100,900);c.moveTo(0,i*100);c.lineTo(900,i*100);c.stroke();}
g.values.forEach((v,i)=>{const x=(i%9)*100,y=Math.floor(i/9)*100;if(v.val){c.font='58px -apple-system,Segoe UI,Arial';c.fillStyle=v.editable?'#325aaf':'#344055';c.textAlign='center';c.fillText(v.val,x+50,y+70);}
 else (g.notes[i]||[]).forEach(d=>{if(!d)return;c.font='22px -apple-system,Segoe UI,Arial';c.fillStyle='#6b7590';c.textAlign='center';c.fillText(d,x+((d-1)%3)*33+17,y+Math.floor((d-1)/3)*33+25);});});}
</script></body></html>
